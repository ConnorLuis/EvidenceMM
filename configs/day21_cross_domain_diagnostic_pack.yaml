  day19_model_json: data/eval/day19_interval_localizer_model.json
  dataset_root: /mnt/f/episodes_pick_place_pilot_v5
  diagnostic_manifest_root: data/manifests/diagnostic_robot_episodes
  processed_root: data/processed/diagnostic_robot_sequence

  document_manifest: data/manifests/sources/sts3215_datasheet.json
  document_visual_manifest: data/processed/vision/sts3215_pages.jsonl
  hybrid_config: configs/day13_hybrid_retrieval.yaml

output:
