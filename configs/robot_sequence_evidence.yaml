cameras:
  - front
  - wrist
timestamp_source: samples_csv.elapsed_ns
processed_root: data/processed/robot_sequence
manifest_root: data/manifests/robot_episodes

slice_duration_sec: 2.0

motion_selection:
  resize_width: 160
  resize_height: 120
  grayscale: true
  difference: mean_absolute_pixel_difference
  fusion: max
  tie_break: lower_frame_index
  verify_source_sha256: true

state_action_selection:
  joint_order:
    - shoulder_pan
    - shoulder_lift
    - elbow_flex
    - wrist_flex
    - wrist_roll
    - gripper
  state_signal: observation
  action_signal: action
  state_change: adjacent_rms
  action_change: adjacent_rms
  fusion: max
  tie_break: lower_frame_index
  normalization: none
  joint_weighting: equal
  tracking_gap_role: diagnostic_only
  verify_tracking_error: true
