frozen_trajectory_intervention:
  physical_cause: trajectory_execution_deviation
  intervention_type: manual_bounded_trajectory_deviation
  primary_changed_factor: commanded_motion_path
  direction: follower_forward
  operational_measurement: marked_lateral_waypoint_offset
  magnitude_range_mm: [40, 60]
  measurement_precision: operator_estimated_range
  rule_zh: >-
    方块保持 nominal，夹爪时序保持 nominal。正常接近至方块正上方附近后，
    仅通过 Leader 将末端 commanded path 沿 Follower 正前方偏移约 40–60 mm，
    保持该偏移继续下降并按正常 clean 时序闭合夹爪；之后继续完成本轮动作。
    不移动方块，不提前或延后夹爪闭合，不增加第二个 trajectory deviation，
    不主动补偿回来抓取方块。要求任务失败。

