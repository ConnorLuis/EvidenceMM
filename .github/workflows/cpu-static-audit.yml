name: CPU Static Audit

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evidencemm-cpu-static-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-audit:
    name: frozen benchmark / schema / hash audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history for frozen ancestry audit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11.15
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.15"
          cache: pip

      - name: Install CPU audit dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt pytest

      - name: Compile Python sources
        run: |
          python -m compileall -q src scripts tests

      - name: Validate Day35 frozen release
        run: |
          python scripts/day35_release_audit.py validate

      - name: Recompute Day34 frozen metrics and hashes
        run: |
          python scripts/day34_metrics_error_efficiency.py audit

      - name: Validate post-Day35 hardening contract
        run: |
          python scripts/release_hardening_audit.py validate

      - name: Run CPU-only frozen schema/hash tests
        run: |
          pytest -q             tests/test_day31_root_cause_baseline.py             tests/test_day32_development_calibration.py             tests/test_day33_single_heldout_eval.py             tests/test_day34_metrics_error_efficiency.py             tests/test_day35_release.py             tests/test_release_hardening.py
